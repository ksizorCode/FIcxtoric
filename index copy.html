<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FICX Histórico - Archivo Digital</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body class="dark-mode">
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo-container">
                    <span class="logo-brand">FICX</span><span class="logo-suffix">torico</span>
                </div>
            </div>
            <ul class="nav-links">
                <li data-view="ediciones" class="active"><i class="fas fa-history"></i> <span>Ediciones</span></li>
                <li data-view="peliculas"><i class="fas fa-film"></i> <span>Películas</span></li>
                <li data-view="cineastas"><i class="fas fa-user-tie"></i> <span>Cineastas</span></li>
                <li data-view="secciones"><i class="fas fa-layer-group"></i> <span>Secciones</span></li>
                <li data-view="eventos"><i class="fas fa-calendar-check"></i> <span>Eventos</span></li>
                <li data-view="galardones"><i class="fas fa-trophy"></i> <span>Galardones</span></li>
                <li data-view="sedes"><i class="fas fa-map-marker-alt"></i> <span>Sedes</span></li>
                <li data-view="favoritos"><i class="fas fa-heart"></i> <span>Favoritos</span></li>
                <li data-view="contacto"><i class="fas fa-envelope"></i> <span>Contacto</span></li>
            </ul>
            <div class="sidebar-footer">
                <button id="theme-toggle"><i class="fas fa-moon"></i> Modo Oscuro</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-bar">
                <div class="search-container">
                    <i class="fas fa-search"></i>
                    <input type="text" id="global-search" placeholder="Buscar películas, cineastas, ediciones...">
                </div>
                <div class="view-controls">
                    <button class="view-btn active" data-mode="grid" title="Vista Grid"><i class="fas fa-th"></i></button>
                    <button class="view-btn" data-mode="gallery" title="Vista Galería"><i class="fas fa-th-list"></i></button>
                    <button class="view-btn" data-mode="list" title="Vista Lista"><i class="fas fa-list"></i></button>
                    <button class="view-btn" data-mode="table" title="Vista Tabla"><i class="fas fa-table"></i></button>
                    <button class="view-btn" data-mode="kanban" title="Vista Kanban"><i class="fas fa-columns"></i></button>
                    <button class="view-btn" data-mode="calendar" title="Vista Calendario"><i class="fas fa-calendar-alt"></i></button>
                    <button class="view-btn" data-mode="map" title="Vista Mapa"><i class="fas fa-map-marked-alt"></i></button>
                    <button class="view-btn" data-mode="dashboard" title="Vista Dashboard"><i class="fas fa-chart-pie"></i></button>
                </div>
            </header>

            <div class="mobile-top-bar">
                <div class="logo-container discrete">
                    <span class="logo-brand">FICX</span><span class="logo-suffix">torico</span>
                </div>
            </div>

            <!-- Dynamic Section -->
            <div id="content-display" class="content-display">
                <!-- Content will be injected here by app.js -->
                <div class="loader"></div>
            </div>
        </main>
    </div>

    <!-- Modal for Details -->
    <div id="detail-modal" class="modal">
        <div class="modal-content glass">
            <span class="close-modal">&times;</span>
            <div id="modal-body"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
